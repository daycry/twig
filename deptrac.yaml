deptrac:
  paths:
    - ./src/
  layers:
    - name: Core
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/.*
          must_not:
            - type: directory
              value: src/Adapter/CodeIgniter4/.*
    - name: Adapter
      collectors:
        - type: directory
          value: src/Adapter/CodeIgniter4/.*
    - name: Framework
      collectors:
        - type: classLike
          value: ^(CodeIgniter|Config)\\.*
  ruleset:
    Core: []
    Adapter:
      - Core
      - Framework
