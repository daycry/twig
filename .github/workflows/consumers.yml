name: Package consumers

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  consumers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        consumer: [standalone, codeigniter]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: intl, mbstring
          coverage: none
      - name: Install isolated consumer
        working-directory: tests/Consumers/${{ matrix.consumer }}
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Verify consumer
        working-directory: tests/Consumers/${{ matrix.consumer }}
        run: php smoke.php
